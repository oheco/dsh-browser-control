<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>DSH 浏览器原生验收</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>DSH 浏览器原生验收</h1><p id="loaded">正在加载</p><form id="form"><label>用户名 <input id="username" name="username" aria-label="用户名" autocomplete="off"></label><label>密码 <input id="password" type="password" value="fixture-private-value" aria-label="密码"></label><label>地区 <select id="country" aria-label="地区"><option value="CN">中国</option><option value="DE">德国</option></select></label><label><input id="subscribe" type="checkbox">订阅</label><button id="submit" type="submit">提交测试</button></form><p id="message" role="status">等待提交</p><button id="disabled" disabled>禁用按钮截图</button><button id="hover" type="button">悬停测试</button><button id="double" type="button">双击测试</button><p id="events">无事件</p><test-counter></test-counter><section class="frame"><h2>iframe 测试</h2><iframe id="frame" src="/frame.html" title="同进程测试 frame"></iframe></section><section class="spacer"><h2>滚动目标</h2><button id="bottom" type="button">底部按钮</button></section></main><script src="/app.js"></script></body></html>
